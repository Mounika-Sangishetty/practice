<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Sign in — Helix AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] },
    colors:{
      brand:{50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eaeff',400:'#5b85ff',500:'#3a63ff',600:'#2547f0',700:'#1d36cc',800:'#1c31a3',900:'#1d2f80',950:'#141d4d'},
      ink:{50:'#f7f8fa',100:'#eef0f4',200:'#d9dde6',300:'#b7bdcd',400:'#8b93aa',500:'#6b7390',600:'#525a76',700:'#3f475f',800:'#222840',900:'#151a2e',950:'#0b0f1f'}
    },
    boxShadow:{ 'soft':'0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06)', 'glow':'0 0 0 1px rgba(58,99,255,.25), 0 10px 40px -10px rgba(58,99,255,.55)' }
  } } };
</script>
</head>
<body class="bg-ink-950 text-ink-100 transition-colors duration-300">
<div id="app"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>
<div id="modal-root"></div>
<script src="assets/common.js"></script>
<script>
mountAuth(AuthShell('Welcome back', 'Sign in to your Helix workspace', `
  ${input('Email','you@company.com','email')}
  ${input('Password','••••••••','password')}
  <div class="flex justify-between items-center text-xs">
    <label class="flex items-center gap-2"><input type="checkbox" class="rounded bg-white/5 ring-1 ring-white/10"/> Remember me</label>
    <a href="forgot-password.html" class="text-brand-400 hover:underline">Forgot password?</a>
  </div>
  <a href="dashboard.html" class="block text-center w-full px-4 py-2.5 rounded-lg bg-white text-ink-900 font-medium hover:bg-ink-100 transition">Sign in</a>
  <div class="relative my-2"><div class="absolute inset-0 flex items-center"><div class="w-full border-t border-white/10"></div></div><span class="relative bg-ink-950 px-2 text-xs text-ink-400 mx-auto block w-fit">or continue with</span></div>
  <div class="grid grid-cols-2 gap-2">
    <button class="px-3 py-2.5 rounded-lg ring-1 ring-white/10 hover:bg-white/5 text-sm flex items-center justify-center gap-2">${icon('chrome','w-4 h-4')} Google</button>
    <button class="px-3 py-2.5 rounded-lg ring-1 ring-white/10 hover:bg-white/5 text-sm flex items-center justify-center gap-2">${icon('github','w-4 h-4')} GitHub</button>
  </div>
`, `Don't have an account? <a href="signup.html" class="text-brand-400 hover:underline">Sign up free</a>`));
</script>
</body>
</html>
