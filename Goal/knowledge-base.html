<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Knowledge Base — Helix AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] },
    colors:{
      brand:{50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eaeff',400:'#5b85ff',500:'#3a63ff',600:'#2547f0',700:'#1d36cc',800:'#1c31a3',900:'#1d2f80',950:'#141d4d'},
      ink:{50:'#f7f8fa',100:'#eef0f4',200:'#d9dde6',300:'#b7bdcd',400:'#8b93aa',500:'#6b7390',600:'#525a76',700:'#3f475f',800:'#222840',900:'#151a2e',950:'#0b0f1f'}
    },
    boxShadow:{ 'soft':'0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06)', 'glow':'0 0 0 1px rgba(58,99,255,.25), 0 10px 40px -10px rgba(58,99,255,.55)' }
  } } };
  window.HELIX_PAGE='kb';
</script>
</head>
<body class="bg-ink-950 text-ink-100 transition-colors duration-300">
<div id="app"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>
<div id="modal-root"></div>
<script src="assets/common.js"></script>
<script>
const CATEGORIES = [
  {n:'Getting Started',i:'rocket',c:24,clr:'brand'},
  {n:'Account & Billing',i:'credit-card',c:18,clr:'emerald'},
  {n:'Integrations',i:'plug',c:32,clr:'fuchsia'},
  {n:'API & Webhooks',i:'code',c:46,clr:'cyan'},
  {n:'Troubleshooting',i:'wrench',c:28,clr:'amber'},
  {n:'Security',i:'shield',c:14,clr:'rose'},
];
const ARTICLES = [
  ['How to reset your password','Account','2 min','248 views'],
  ['Setting up Slack integration','Integrations','5 min','1.2k views'],
  ['Understanding usage limits','Billing','3 min','892 views'],
  ['API authentication guide','API','7 min','3.1k views'],
  ['Migrating from Zendesk','Getting Started','12 min','2.4k views'],
];

function KBContent(){
  return `
  <div class="space-y-5 animate-fade-in">
    <div class="flex flex-col sm:flex-row justify-between gap-3">
      <div>
        <h2 class="text-2xl font-bold">Knowledge Base</h2>
        <p class="text-sm text-ink-400">162 articles · 6 categories · Updated today</p>
      </div>
      <button onclick="openArticleEditor()" class="px-3 py-2 rounded-lg bg-white text-ink-900 text-sm font-medium hover:bg-ink-100 flex items-center gap-1.5">${icon('plus','w-4 h-4')} New article</button>
    </div>

    <div class="relative max-w-2xl">
      <span class="absolute left-3 top-1/2 -translate-y-1/2 text-ink-500">${icon('search','w-4 h-4')}</span>
      <input type="text" placeholder="Search 162 articles…" class="w-full pl-10 pr-4 py-3 bg-white/5 ring-1 ring-white/10 rounded-xl text-sm focus:ring-brand-500 outline-none"/>
    </div>

    <div>
      <h3 class="text-sm font-semibold mb-3">Categories</h3>
      <div class="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        ${CATEGORIES.map(c=>`
          <div class="glass rounded-xl p-4 hover:-translate-y-0.5 transition cursor-pointer">
            <div class="flex items-center gap-3">
              <div class="w-10 h-10 rounded-lg bg-${c.clr}-500/15 grid place-items-center text-${c.clr}-300">${icon(c.i,'w-5 h-5')}</div>
              <div class="flex-1"><p class="font-medium">${c.n}</p><p class="text-xs text-ink-400">${c.c} articles</p></div>
              ${icon('arrow-right','w-4 h-4 text-ink-500')}
            </div>
          </div>
        `).join('')}
      </div>
    </div>

    <div>
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-sm font-semibold">Popular articles</h3>
        <a href="#" class="text-xs text-brand-400 hover:underline">View all →</a>
      </div>
      <div class="glass rounded-xl divide-y divide-white/5">
        ${ARTICLES.map(a=>`
          <div class="p-4 hover:bg-white/[.03] cursor-pointer flex items-center gap-4 transition">
            <div class="w-9 h-9 rounded-lg bg-white/5 grid place-items-center text-ink-300">${icon('file-text','w-4 h-4')}</div>
            <div class="flex-1 min-w-0">
              <p class="font-medium text-sm">${a[0]}</p>
              <p class="text-xs text-ink-400 mt-0.5">${a[1]} · ${a[2]} read</p>
            </div>
            <div class="hidden sm:flex items-center gap-3 text-xs text-ink-400">
              <span class="flex items-center gap-1">${icon('eye','w-3 h-3')} ${a[3]}</span>
              <span class="flex items-center gap-1 text-emerald-400">${icon('thumbs-up','w-3 h-3')} 96%</span>
            </div>
            <button class="p-2 hover:bg-white/5 rounded">${icon('more-horizontal','w-4 h-4')}</button>
          </div>
        `).join('')}
      </div>
    </div>
  </div>`;
}

function openArticleEditor(){
  ensureModalRoot().innerHTML = `
  <div class="fixed inset-0 z-50 grid place-items-center p-4 animate-fade-in">
    <div class="absolute inset-0 bg-black/70" onclick="closeModal()"></div>
    <div class="relative w-full max-w-3xl glass rounded-2xl shadow-soft ring-1 ring-white/10 animate-slide-up max-h-[90vh] flex flex-col">
      <div class="p-4 border-b border-white/5 flex justify-between items-center">
        <h3 class="font-semibold">New Article</h3>
        <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/5">${icon('x','w-4 h-4')}</button>
      </div>
      <div class="p-5 space-y-4 overflow-y-auto">
        <input type="text" placeholder="Article title…" class="w-full text-2xl font-bold bg-transparent placeholder-ink-500 outline-none"/>
        <div class="flex gap-2 text-xs">
          <select class="bg-white/5 ring-1 ring-white/10 rounded-md px-2 py-1.5"><option>Getting Started</option></select>
          <button class="px-2.5 py-1.5 rounded-md ring-1 ring-white/10 hover:bg-white/5">${icon('tag','w-3 h-3 inline mr-1')}Tags</button>
        </div>
        <div class="flex flex-wrap gap-1 p-2 rounded-lg bg-white/5 ring-1 ring-white/10">
          ${['bold','italic','underline','heading-1','heading-2','list','list-ordered','quote','code','link','image','video'].map(i=>`<button class="p-1.5 rounded hover:bg-white/10">${icon(i,'w-3.5 h-3.5')}</button>`).join('')}
        </div>
        <div contenteditable class="min-h-[280px] p-3 rounded-lg bg-white/5 ring-1 ring-white/10 focus:ring-brand-500 outline-none text-sm leading-relaxed">
          <p>Start writing your article here…</p>
        </div>
      </div>
      <div class="p-4 border-t border-white/5 flex justify-between items-center">
        <span class="text-xs text-ink-400">Auto-saved 2 seconds ago</span>
        <div class="flex gap-2">
          <button class="px-3 py-1.5 rounded-lg ring-1 ring-white/10 hover:bg-white/5 text-xs">Save draft</button>
          <button onclick="toast('Article published!','success');closeModal()" class="px-3 py-1.5 rounded-lg bg-white text-ink-900 text-xs font-medium">Publish</button>
        </div>
      </div>
    </div>
  </div>`;
  refreshIcons();
}

window.__lastContent = KBContent();
mountDashboard('kb', window.__lastContent);
</script>
</body>
</html>
