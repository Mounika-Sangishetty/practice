<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Inbox — Helix AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] },
    colors:{
      brand:{50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eaeff',400:'#5b85ff',500:'#3a63ff',600:'#2547f0',700:'#1d36cc',800:'#1c31a3',900:'#1d2f80',950:'#141d4d'},
      ink:{50:'#f7f8fa',100:'#eef0f4',200:'#d9dde6',300:'#b7bdcd',400:'#8b93aa',500:'#6b7390',600:'#525a76',700:'#3f475f',800:'#222840',900:'#151a2e',950:'#0b0f1f'}
    },
    boxShadow:{ 'soft':'0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06)', 'glow':'0 0 0 1px rgba(58,99,255,.25), 0 10px 40px -10px rgba(58,99,255,.55)' }
  } } };
  window.HELIX_PAGE='inbox';
</script>
</head>
<body class="bg-ink-950 text-ink-100 transition-colors duration-300">
<div id="app"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>
<div id="modal-root"></div>
<script src="assets/common.js"></script>
<script>
function InboxContent(){
  return `
  <div class="animate-fade-in">
    <div class="grid grid-cols-12 gap-4 h-[calc(100vh-9rem)]">
      <div class="col-span-12 md:col-span-4 lg:col-span-3 glass rounded-xl flex flex-col overflow-hidden">
        <div class="p-3 border-b border-white/5">
          <div class="flex items-center justify-between mb-3">
            <h3 class="font-semibold text-sm">Inbox <span class="text-ink-400 font-normal">(12)</span></h3>
            <button class="p-1.5 rounded-md hover:bg-white/5">${icon('filter','w-4 h-4 text-ink-400')}</button>
          </div>
          <div class="relative">
            <span class="absolute left-2.5 top-1/2 -translate-y-1/2 text-ink-500">${icon('search','w-3.5 h-3.5')}</span>
            <input class="w-full bg-white/5 ring-1 ring-white/10 rounded-md pl-8 pr-2 py-1.5 text-xs focus:ring-brand-500 outline-none" placeholder="Search conversations…"/>
          </div>
          <div class="flex gap-1 mt-3 text-[11px]">
            ${['All','Unread','Mentions','Mine'].map((t,i)=>`<button class="px-2 py-1 rounded-md ${i===0?'bg-brand-500/20 text-brand-300':'text-ink-400 hover:bg-white/5'}">${t}</button>`).join('')}
          </div>
        </div>
        <div class="flex-1 overflow-y-auto scroll-thin">
          ${DATA.chats.map((c,i)=>`
            <div class="flex items-start gap-2.5 p-3 hover:bg-white/5 transition cursor-pointer border-b border-white/5 ${i===0?'bg-white/5':''}">
              ${avatar(c.avatar,'w-9 h-9',c.online)}
              <div class="flex-1 min-w-0">
                <div class="flex justify-between items-center">
                  <p class="text-sm font-semibold truncate">${c.name}</p>
                  <span class="text-[10px] text-ink-400">${c.time}</span>
                </div>
                <p class="text-xs text-ink-400 truncate mt-0.5">${c.last}</p>
                <div class="flex items-center gap-1 mt-1.5">
                  <span class="text-[9px] px-1.5 py-0.5 rounded bg-white/5 text-ink-300">${c.tag}</span>
                  ${c.unread?`<span class="ml-auto text-[10px] font-medium bg-brand-500 text-white rounded-full w-4 h-4 grid place-items-center">${c.unread}</span>`:''}
                </div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>

      <div class="hidden md:flex md:col-span-8 lg:col-span-6 glass rounded-xl flex-col overflow-hidden">
        <div class="p-3 border-b border-white/5 flex items-center justify-between">
          <div class="flex items-center gap-3">
            ${avatar('EH','w-10 h-10',true)}
            <div>
              <p class="text-sm font-semibold flex items-center gap-1.5">Eleanor Hughes <span class="text-[10px] px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300">VIP</span></p>
              <p class="text-[11px] text-emerald-400">● Online · typing…</p>
            </div>
          </div>
          <div class="flex gap-1">
            ${['phone','video','star','more-horizontal'].map(i=>`<button class="p-2 rounded-lg hover:bg-white/5">${icon(i,'w-4 h-4 text-ink-400')}</button>`).join('')}
          </div>
        </div>
        <div class="flex-1 overflow-y-auto p-5 space-y-4 scroll-thin">
          <p class="text-center text-[11px] text-ink-500">Today · 10:24 AM</p>
          <div class="flex items-end gap-2">
            ${avatar('EH','w-7 h-7')}
            <div>
              <div class="bg-white/5 rounded-2xl rounded-bl-sm px-3.5 py-2.5 text-sm max-w-md">Hey! I'm trying to export my Q1 report but it keeps failing. Any ideas?</div>
              <p class="text-[10px] text-ink-500 mt-1 ml-1">10:24 AM</p>
            </div>
          </div>
          <div class="flex items-end gap-2 justify-end">
            <div>
              <div class="bg-brand-500 text-white rounded-2xl rounded-br-sm px-3.5 py-2.5 text-sm max-w-md">Hi Eleanor! Sorry to hear that. Let me take a look — can you share the report ID?</div>
              <p class="text-[10px] text-ink-500 mt-1 mr-1 text-right">10:25 AM · Read</p>
            </div>
            ${avatar('JD','w-7 h-7')}
          </div>
          <div class="flex items-end gap-2">
            ${avatar('EH','w-7 h-7')}
            <div>
              <div class="bg-white/5 rounded-2xl rounded-bl-sm px-3.5 py-2.5 text-sm max-w-md">RPT_2389472. It's 84MB and 50k+ rows.</div>
              <div class="mt-2 inline-flex items-center gap-2 bg-white/5 ring-1 ring-white/10 rounded-xl p-2.5 max-w-xs">
                <div class="w-9 h-9 rounded-lg bg-rose-500/20 grid place-items-center text-rose-300">${icon('file-text','w-4 h-4')}</div>
                <div class="min-w-0 flex-1">
                  <p class="text-xs font-medium truncate">error_log.pdf</p>
                  <p class="text-[10px] text-ink-400">84 KB</p>
                </div>
                ${icon('download','w-3.5 h-3.5 text-ink-400')}
              </div>
              <p class="text-[10px] text-ink-500 mt-1 ml-1">10:26 AM</p>
            </div>
          </div>

          <div class="ml-9 p-3 rounded-xl ring-1 ring-brand-500/30 bg-brand-500/5">
            <div class="flex items-center justify-between mb-2">
              <p class="text-xs font-medium text-brand-300 flex items-center gap-1.5">${icon('sparkles','w-3.5 h-3.5')} AI Suggestions</p>
              <button class="text-[10px] text-ink-400 hover:text-white">Refresh</button>
            </div>
            <div class="space-y-2">
              ${[
                'I can see you hit the 50k row export limit. I just bumped it to 250k for your workspace — try again!',
                'Try exporting in chunks of 25k for faster processing. Want me to schedule it?',
                'Looks like a known issue we patched today. Pull the latest CLI and retry.'
              ].map(s=>`
                <button class="w-full text-left p-2.5 bg-white/5 hover:bg-white/10 rounded-lg text-xs transition flex justify-between items-center group">
                  <span class="flex-1">${s}</span>
                  ${icon('arrow-up-right','w-3.5 h-3.5 text-ink-400 group-hover:text-white ml-2')}
                </button>
              `).join('')}
            </div>
          </div>

          <div class="flex items-end gap-2">
            ${avatar('EH','w-7 h-7')}
            <div class="bg-white/5 rounded-2xl rounded-bl-sm px-4 py-3 flex gap-1">
              <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-pulse-dot"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-pulse-dot" style="animation-delay:.15s"></span>
              <span class="w-1.5 h-1.5 rounded-full bg-ink-400 animate-pulse-dot" style="animation-delay:.3s"></span>
            </div>
          </div>
        </div>
        <div class="p-3 border-t border-white/5">
          <div class="rounded-xl ring-1 ring-white/10 bg-white/5 focus-within:ring-brand-500 transition">
            <textarea rows="2" placeholder="Type a reply… use / for shortcuts" class="w-full bg-transparent px-3 py-2.5 text-sm placeholder-ink-500 outline-none resize-none"></textarea>
            <div class="flex items-center justify-between px-2 pb-2">
              <div class="flex gap-0.5 text-ink-400">
                ${['paperclip','smile','image','at-sign','bold','italic'].map(i=>`<button class="p-1.5 rounded-md hover:bg-white/5 hover:text-white">${icon(i,'w-4 h-4')}</button>`).join('')}
              </div>
              <div class="flex items-center gap-2">
                <button class="text-[11px] text-brand-300 hover:text-brand-200 flex items-center gap-1">${icon('sparkles','w-3.5 h-3.5')} AI rewrite</button>
                <button onclick="toast('Message sent','success')" class="px-3 py-1.5 rounded-lg bg-white text-ink-900 text-xs font-medium hover:bg-ink-100 flex items-center gap-1">Send ${icon('send','w-3.5 h-3.5')}</button>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div class="hidden lg:flex lg:col-span-3 glass rounded-xl flex-col overflow-hidden">
        <div class="p-5 border-b border-white/5 text-center">
          ${avatar('EH','w-16 h-16 mx-auto !text-base',true)}
          <p class="mt-3 font-semibold">Eleanor Hughes</p>
          <p class="text-xs text-ink-400">eleanor@acme.com</p>
          <div class="mt-3 flex justify-center gap-2">
            <button class="px-2.5 py-1 text-[11px] rounded-md bg-white/5 ring-1 ring-white/10 hover:bg-white/10">${icon('mail','w-3 h-3 inline mr-1')}Email</button>
            <button class="px-2.5 py-1 text-[11px] rounded-md bg-white/5 ring-1 ring-white/10 hover:bg-white/10">${icon('phone','w-3 h-3 inline mr-1')}Call</button>
          </div>
        </div>
        <div class="p-4 border-b border-white/5">
          <p class="text-[10px] uppercase tracking-wider text-ink-500 font-semibold mb-2">Profile</p>
          <div class="space-y-2 text-xs">
            ${[['Company','Acme Corp'],['Plan','Enterprise'],['MRR','$4,200'],['Joined','Mar 2023'],['Location','San Francisco, US'],['Timezone','PST']].map(r=>`
              <div class="flex justify-between"><span class="text-ink-400">${r[0]}</span><span class="font-medium">${r[1]}</span></div>
            `).join('')}
          </div>
        </div>
        <div class="p-4 border-b border-white/5">
          <p class="text-[10px] uppercase tracking-wider text-ink-500 font-semibold mb-2">AI Sentiment</p>
          <div class="p-3 rounded-lg bg-emerald-500/10 ring-1 ring-emerald-500/20">
            <p class="text-xs text-emerald-300 font-medium flex items-center gap-1">${icon('heart','w-3 h-3')} Very Positive · 0.94</p>
            <p class="text-[11px] text-ink-300 mt-1">Customer mood is calm and cooperative.</p>
          </div>
        </div>
        <div class="p-4 flex-1 overflow-y-auto">
          <p class="text-[10px] uppercase tracking-wider text-ink-500 font-semibold mb-2">Recent Tickets</p>
          <div class="space-y-2">
            ${DATA.tickets.slice(0,3).map(t=>`
              <div class="p-2 rounded-lg hover:bg-white/5 cursor-pointer">
                <p class="text-xs font-medium truncate">${t.id} ${t.subject}</p>
                <div class="flex gap-1 mt-1">${statusBadge(t.status)}</div>
              </div>
            `).join('')}
          </div>
        </div>
      </div>
    </div>
  </div>`;
}
window.__lastContent = InboxContent();
mountDashboard('inbox', window.__lastContent);
</script>
</body>
</html>
