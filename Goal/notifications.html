<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Notifications — Helix AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] },
    colors:{
      brand:{50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eaeff',400:'#5b85ff',500:'#3a63ff',600:'#2547f0',700:'#1d36cc',800:'#1c31a3',900:'#1d2f80',950:'#141d4d'},
      ink:{50:'#f7f8fa',100:'#eef0f4',200:'#d9dde6',300:'#b7bdcd',400:'#8b93aa',500:'#6b7390',600:'#525a76',700:'#3f475f',800:'#222840',900:'#151a2e',950:'#0b0f1f'}
    },
    boxShadow:{ 'soft':'0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06)', 'glow':'0 0 0 1px rgba(58,99,255,.25), 0 10px 40px -10px rgba(58,99,255,.55)' }
  } } };
  window.HELIX_PAGE='notifications';
</script>
</head>
<body class="bg-ink-950 text-ink-100 transition-colors duration-300">
<div id="app"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>
<div id="modal-root"></div>
<script src="assets/common.js"></script>
<script>
function NotificationsContent(){
  return `
  <div class="space-y-5 animate-fade-in max-w-4xl">
    <div class="flex justify-between gap-3">
      <div>
        <h2 class="text-2xl font-bold">Notifications</h2>
        <p class="text-sm text-ink-400">All your updates in one place</p>
      </div>
      <div class="flex gap-2">
        <button class="px-3 py-2 rounded-lg ring-1 ring-white/10 bg-white/5 hover:bg-white/10 text-sm">Mark all read</button>
        <a href="settings.html" class="px-3 py-2 rounded-lg ring-1 ring-white/10 bg-white/5 hover:bg-white/10 text-sm">${icon('settings','w-4 h-4 inline mr-1')}Preferences</a>
      </div>
    </div>

    <div class="flex gap-2 text-xs flex-wrap">
      ${['All','Unread','Mentions','Tickets','System'].map((t,i)=>`<button class="px-3 py-1.5 rounded-full ${i===0?'bg-brand-500 text-white':'bg-white/5 ring-1 ring-white/10 hover:bg-white/10'}">${t}</button>`).join('')}
    </div>

    <div class="glass rounded-xl divide-y divide-white/5">
      ${[...DATA.notifications, ...DATA.notifications].map((n,i)=>`
        <div class="p-4 flex items-start gap-3 hover:bg-white/[.03] transition cursor-pointer ${n.unread?'bg-brand-500/[.04]':''}">
          <div class="w-10 h-10 rounded-lg bg-white/5 grid place-items-center text-brand-300">${icon(n.icon,'w-4 h-4')}</div>
          <div class="flex-1 min-w-0">
            <p class="font-medium">${n.title}</p>
            <p class="text-sm text-ink-400 mt-0.5">${n.body}</p>
            <p class="text-xs text-ink-500 mt-1">${n.time} ago · #${48000+i}</p>
          </div>
          <div class="flex items-center gap-2">
            ${n.unread?`<span class="w-2 h-2 rounded-full bg-brand-400"></span>`:''}
            <button class="p-1.5 hover:bg-white/5 rounded">${icon('more-horizontal','w-4 h-4')}</button>
          </div>
        </div>
      `).join('')}
    </div>
  </div>`;
}
window.__lastContent = NotificationsContent();
mountDashboard('notifications', window.__lastContent);
</script>
</body>
</html>
