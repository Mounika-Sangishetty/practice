<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Team — Helix AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] },
    colors:{
      brand:{50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eaeff',400:'#5b85ff',500:'#3a63ff',600:'#2547f0',700:'#1d36cc',800:'#1c31a3',900:'#1d2f80',950:'#141d4d'},
      ink:{50:'#f7f8fa',100:'#eef0f4',200:'#d9dde6',300:'#b7bdcd',400:'#8b93aa',500:'#6b7390',600:'#525a76',700:'#3f475f',800:'#222840',900:'#151a2e',950:'#0b0f1f'}
    },
    boxShadow:{ 'soft':'0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06)', 'glow':'0 0 0 1px rgba(58,99,255,.25), 0 10px 40px -10px rgba(58,99,255,.55)' }
  } } };
  window.HELIX_PAGE='team';
</script>
</head>
<body class="bg-ink-950 text-ink-100 transition-colors duration-300">
<div id="app"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>
<div id="modal-root"></div>
<script src="assets/common.js"></script>
<script>
const TEAM = [
  {name:'Ava Carter',email:'ava@acme.com',role:'Admin',team:'Support',last:'Active now',online:true,a:'AC'},
  {name:'Liam Reyes',email:'liam@acme.com',role:'Manager',team:'Support',last:'5 min ago',online:true,a:'LR'},
  {name:'Sofia Patel',email:'sofia@acme.com',role:'Agent',team:'AI Ops',last:'1 hour ago',online:false,a:'SP'},
  {name:'Noah Kim',email:'noah@acme.com',role:'Agent',team:'Support',last:'Active now',online:true,a:'NK'},
  {name:'Mia Johnson',email:'mia@acme.com',role:'Agent',team:'Support',last:'Yesterday',online:false,a:'MJ'},
  {name:'Daniel West',email:'daniel@acme.com',role:'Viewer',team:'Sales',last:'2 days ago',online:false,a:'DW'},
];

function TeamContent(){
  return `
  <div class="space-y-5 animate-fade-in">
    <div class="flex flex-col sm:flex-row justify-between gap-3">
      <div>
        <h2 class="text-2xl font-bold">Team</h2>
        <p class="text-sm text-ink-400">${TEAM.length} members · 3 teams · 1 pending invite</p>
      </div>
      <button onclick="openInviteModal()" class="px-3 py-2 rounded-lg bg-white text-ink-900 text-sm font-medium hover:bg-ink-100 flex items-center gap-1.5">${icon('user-plus','w-4 h-4')} Invite member</button>
    </div>

    <div class="grid sm:grid-cols-4 gap-4">
      ${[['Members',TEAM.length,'users'],['Online',4,'circle-dot'],['Admins',1,'shield'],['Pending',1,'mail']].map(s=>`
        <div class="glass rounded-xl p-4 flex items-center gap-3">
          <div class="w-9 h-9 rounded-lg bg-white/5 grid place-items-center text-brand-300">${icon(s[2],'w-4 h-4')}</div>
          <div><p class="text-xs text-ink-400">${s[0]}</p><p class="font-bold text-xl">${s[1]}</p></div>
        </div>
      `).join('')}
    </div>

    <div class="glass rounded-xl overflow-hidden">
      <div class="p-4 border-b border-white/5 flex justify-between gap-3">
        <input class="bg-white/5 ring-1 ring-white/10 rounded-md px-3 py-1.5 text-sm" placeholder="Search members…"/>
        <div class="flex gap-2 text-xs">
          <select class="bg-white/5 ring-1 ring-white/10 rounded-md px-2 py-1.5"><option>All roles</option><option>Admin</option><option>Manager</option><option>Agent</option></select>
          <select class="bg-white/5 ring-1 ring-white/10 rounded-md px-2 py-1.5"><option>All teams</option></select>
        </div>
      </div>
      <table class="w-full text-sm">
        <thead class="bg-white/[.02] text-ink-400 text-xs uppercase">
          <tr><th class="p-3 text-left">Member</th><th class="p-3 text-left">Role</th><th class="p-3 text-left">Team</th><th class="p-3 text-left">Last active</th><th class="p-3"></th></tr>
        </thead>
        <tbody class="divide-y divide-white/5">
          ${TEAM.map(m=>`
            <tr class="hover:bg-white/[.03]">
              <td class="p-3"><div class="flex items-center gap-3">${avatar(m.a,'w-9 h-9',m.online)}<div><p class="font-medium">${m.name}</p><p class="text-xs text-ink-400">${m.email}</p></div></div></td>
              <td class="p-3"><span class="text-xs px-2 py-0.5 rounded-full ring-1 ${m.role==='Admin'?'bg-rose-500/10 text-rose-300 ring-rose-500/20':m.role==='Manager'?'bg-amber-500/10 text-amber-300 ring-amber-500/20':'bg-white/5 text-ink-300 ring-white/10'}">${m.role}</span></td>
              <td class="p-3 text-ink-300">${m.team}</td>
              <td class="p-3 text-ink-300 text-xs">${m.last}</td>
              <td class="p-3 text-right"><button class="p-1.5 hover:bg-white/5 rounded">${icon('more-horizontal','w-4 h-4')}</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
    </div>

    <div class="glass rounded-xl p-5">
      <h4 class="font-semibold mb-4">Team Activity Today</h4>
      <canvas id="teamActivity" height="160"></canvas>
    </div>
  </div>`;
}

function openInviteModal(){
  ensureModalRoot().innerHTML = `
  <div class="fixed inset-0 z-50 grid place-items-center p-4 animate-fade-in">
    <div class="absolute inset-0 bg-black/70" onclick="closeModal()"></div>
    <div class="relative w-full max-w-md glass rounded-2xl ring-1 ring-white/10 p-6 animate-slide-up">
      <div class="flex justify-between items-start mb-4">
        <div>
          <h3 class="text-lg font-semibold">Invite team members</h3>
          <p class="text-xs text-ink-400 mt-1">They'll receive an email with sign-in instructions.</p>
        </div>
        <button onclick="closeModal()" class="p-1.5 rounded-lg hover:bg-white/5">${icon('x','w-4 h-4')}</button>
      </div>
      <div class="space-y-4">
        ${input('Email','colleague@acme.com','email')}
        <div>
          <label class="text-xs text-ink-300 mb-1.5 block">Role</label>
          <select class="w-full bg-white/5 ring-1 ring-white/10 rounded-lg p-2.5 text-sm">
            <option>Agent — answer tickets & chats</option>
            <option>Manager — manage agents & workflows</option>
            <option>Admin — full workspace access</option>
            <option>Viewer — read-only access</option>
          </select>
        </div>
        <div>
          <label class="text-xs text-ink-300 mb-1.5 block">Personal message (optional)</label>
          <textarea rows="3" class="w-full bg-white/5 ring-1 ring-white/10 rounded-lg p-2.5 text-sm"></textarea>
        </div>
        <button onclick="toast('Invite sent!','success');closeModal()" class="w-full px-4 py-2.5 rounded-lg bg-white text-ink-900 font-medium hover:bg-ink-100">Send invitation</button>
      </div>
    </div>
  </div>`;
  refreshIcons();
}

window.__lastContent = TeamContent();
mountDashboard('team', window.__lastContent);
</script>
</body>
</html>
