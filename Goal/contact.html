<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Contact — Helix AI</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/styles.css">
<script>
  tailwind.config = { darkMode:'class', theme:{ extend:{
    fontFamily:{ sans:['Inter','system-ui','sans-serif'], mono:['JetBrains Mono','monospace'] },
    colors:{
      brand:{50:'#eef4ff',100:'#dbe6ff',200:'#bccfff',300:'#8eaeff',400:'#5b85ff',500:'#3a63ff',600:'#2547f0',700:'#1d36cc',800:'#1c31a3',900:'#1d2f80',950:'#141d4d'},
      ink:{50:'#f7f8fa',100:'#eef0f4',200:'#d9dde6',300:'#b7bdcd',400:'#8b93aa',500:'#6b7390',600:'#525a76',700:'#3f475f',800:'#222840',900:'#151a2e',950:'#0b0f1f'}
    },
    boxShadow:{ 'soft':'0 1px 2px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06)', 'glow':'0 0 0 1px rgba(58,99,255,.25), 0 10px 40px -10px rgba(58,99,255,.55)' }
  } } };
</script>
</head>
<body class="bg-ink-950 text-ink-100 transition-colors duration-300">
<div id="app"></div>
<div id="toast-root" class="fixed bottom-6 right-6 z-[100] flex flex-col gap-2"></div>
<div id="modal-root"></div>
<script src="assets/common.js"></script>
<script>
function ContactContent(){
  return `
  <section class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20 grid md:grid-cols-2 gap-12 radial-bg">
    <div>
      <p class="text-sm text-brand-400 font-medium">GET IN TOUCH</p>
      <h1 class="mt-2 text-4xl md:text-5xl font-bold">Let's talk support.</h1>
      <p class="mt-3 text-ink-300">Have a question, need a demo, or want enterprise pricing? Our team replies within 1 hour.</p>
      <div class="mt-8 space-y-5">
        ${[
          {i:'mail',t:'Email',v:'hello@helix.ai'},
          {i:'phone',t:'Phone',v:'+1 (415) 555-0921'},
          {i:'map-pin',t:'HQ',v:'500 Howard St · San Francisco, CA'},
          {i:'message-circle',t:'Live chat',v:'24/7 in-app support'},
        ].map(c=>`
          <div class="flex items-start gap-3">
            <div class="w-9 h-9 rounded-lg bg-white/5 grid place-items-center text-brand-300">${icon(c.i,'w-4 h-4')}</div>
            <div><p class="text-xs text-ink-400">${c.t}</p><p class="text-sm font-medium">${c.v}</p></div>
          </div>
        `).join('')}
      </div>
      <div class="mt-8 rounded-2xl overflow-hidden ring-1 ring-white/10 h-56 relative">
        <div class="absolute inset-0 bg-gradient-to-br from-brand-500/30 via-fuchsia-500/20 to-cyan-500/20"></div>
        <div class="absolute inset-0 grid place-items-center text-ink-200 text-sm flex flex-col">
          ${icon('map','w-8 h-8 mb-2 text-white')}
          <span>HQ — San Francisco</span>
        </div>
      </div>
    </div>
    <form onsubmit="event.preventDefault();toast(&quot;Message sent! We&#39;ll reply within 1 hour.&quot;,&quot;success&quot;)" class="glass rounded-2xl p-7 space-y-4 h-fit">
      <h3 class="text-xl font-semibold">Send us a message</h3>
      <div class="grid sm:grid-cols-2 gap-4">
        ${input('First name','Jane')} ${input('Last name','Doe')}
      </div>
      ${input('Work email','jane@company.com','email')}
      ${input('Company','Acme Inc')}
      <div>
        <label class="text-xs text-ink-300 mb-1.5 block">How can we help?</label>
        <textarea rows="4" placeholder="Tell us what you're looking for..." class="w-full bg-white/5 ring-1 ring-white/10 rounded-lg px-3 py-2.5 text-sm placeholder-ink-500 focus:ring-brand-500 focus:outline-none"></textarea>
      </div>
      <button class="w-full px-4 py-2.5 rounded-lg bg-white text-ink-900 font-medium hover:bg-ink-100 transition">Send message</button>
    </form>
  </section>`;
}
mountPublic(ContactContent());
</script>
</body>
</html>
