<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Day10</title>
</head>
<body>
    <p id="text2"></p>
    <p id="text">Loading...</p>
    <p id="text1">Waiting...</p>
    <p id="text3"></p>
    <button id="start">Start</button>
    <button id="stop">Stop</button>
    <button id="reset">Reset</button></br>
    <input id="count" placeholder="Enter Count here..." style="margin-top: 1rem;">
    <button id="countStart">Start</button>
    <h1 id="countHeading"></h1>
    
</body>
</html>
<script>
    setTimeout(function () {
        console.log("Hello");
    }, 2000);

    setTimeout(function (){
        console.log("welcome");
    
    },3000);

    let text = document.getElementById("text");
    setTimeout( function () {
        text.innerText= "Data Loaded";
    }, 2000);

    let text1 = document.getElementById("text1");
    setTimeout( function (){
        text1.innerText = "Welcome to JavaScript!";
    },3000);

    let count = 0;
   let timer = setInterval(() =>{
        console.log("Hello");
        count++;
        console.log(count);
        if(count === 5){
            console.log("stop");
            
            clearInterval(timer);
        }
    },1000);
    
   let text2 = document.getElementById("text2");
   console.log(`${new Date().getHours()}:${new Date().getMinutes()}:${new Date().getSeconds()}`);
   function time(){
        let now = new Date();

        let hours = now.getHours();
        let minutes = now.getMinutes();
        let seconds = now.getSeconds();

        let interval = hours >= 12 ? "PM" : "AM";
        hours = hours % 12 || 12;

        hours = String(hours).padStart(2, "0");
        minutes = String(minutes).padStart(2, "0");
        seconds = String(seconds).padStart(2, "0");

        text2.innerText = `${hours}:${minutes}:${seconds} ${interval}`;
   }
    time();

    setInterval(time, 1000);

    let text3 = document.getElementById("text3");
    let startButton = document.getElementById("start");
    let stopButton = document.getElementById("stop");
    let resetButton = document.getElementById("reset");
    let minutesData = 0;
    let secondsData = 0;
    text3.innerText = `00:00`;

    function update(){
        let displayMinutes = String(minutesData).padStart(2, "0");
        let displaySeconds = String(secondsData).padStart(2, "0");
        text3.innerText = `${displayMinutes}:${displaySeconds}`;
   }

    function seconds(){
        secondsData++;
        if(secondsData===60){
            minutesData++;
            secondsData=0;
        }
        update();
    }
    let watch = null;

   startButton.addEventListener("click", ()=>{
    if (!watch) {
        watch = setInterval(seconds, 1000);
    }
   
   });

   stopButton.addEventListener("click", ()=>{
        clearInterval(watch);
        watch = null;
   });

   resetButton.addEventListener("click", ()=>{
    clearInterval(watch);
    watch = null;
        minutesData = 0;
        secondsData = 0;
        update();
   })

   let countData = document.getElementById("count");
   let countButton = document.getElementById("countStart");
   let countHeading = document.getElementById("countHeading")

   let countDownNum;
   
   
    let watch1 = null;
   function countDown() {
        countDownNum--;

        if (countDownNum <= 0) {
            countHeading.innerText = "Time Up!";
            clearInterval(watch1);
            watch1 = null;
            countData.value = "";
            countData.focus();
            return;
        }

        countHeading.innerText = countDownNum;
    }
  

  
    countButton.addEventListener("click", () => {

    if (watch1) {
        return;   // Timer is already running
    }

    countDownNum = parseInt(countData.value);

    if (isNaN(countDownNum) || countDownNum <= 0) {
        alert("Please enter a valid number");
        return;
    }

    countHeading.innerText = countDownNum;

    watch1 = setInterval(countDown, 1000);
    countData.value = "";
});
    
    
</script>
